services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: asc_recovery
      POSTGRES_USER: asc_owner
      POSTGRES_PASSWORD: asc_owner_dev_password
    ports:
      - "5432:5432"
    volumes:
      - asc_pg_data:/var/lib/postgresql/data
      - ./scripts/db/init_roles.sql:/docker-entrypoint-initdb.d/01_init_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asc_owner -d asc_recovery"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Phase 9: the app itself, built from the repo's Dockerfile. Connects
  # as `asc_app` (the non-owner runtime role, per docs/DB_SETUP.md), never
  # `asc_owner` -- this container has no DDL privileges. Migrations are a
  # separate, explicit step (see docs/RUNBOOK.md) -- deliberately not run
  # automatically on container start; `docker compose up` alone will
  # leave the schema unmigrated the first time.
  #
  # JWT_SECRET_KEY / ANTHROPIC_API_KEY below are placeholder dev values,
  # same "fine for local-only, never reused anywhere real" status as
  # postgres's fixed dev passwords above (see docs/PROGRESS.md's Phase
  # 3/4 notes) -- replace ANTHROPIC_API_KEY with a real key to actually
  # exercise packet generation locally.
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # sslmode=disable is explicit, not an oversight -- db.base.make_engine
      # (F-07, docs/audit/REGISTER.md) now defaults to sslmode=require
      # whenever a DATABASE_URL omits sslmode entirely, and this local
      # postgres:16 image has no TLS configured at all.
      DATABASE_URL: "postgresql+psycopg://asc_app:asc_app_dev_password@postgres:5432/asc_recovery?sslmode=disable"
      JWT_SECRET_KEY: "local-dev-jwt-secret-never-use-in-production"
      ANTHROPIC_API_KEY: "replace-with-a-real-key-to-exercise-packet-generation"
      # base64 of 32 zero bytes -- fine for local-only, same "never reused
      # anywhere real" status as the other dev values above. A real
      # deployment gets this from Secrets Manager/Key Vault (see
      # security/kms_env.py and docs/RUNBOOK.md), generated with
      # `openssl rand -base64 32`, never a fixed value like this one.
      PHI_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  asc_pg_data:
