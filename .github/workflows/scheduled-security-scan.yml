# Phase 10: the six-monthly vulnerability scan the 2026 HIPAA Security Rule
# requires. Re-runs bandit, pip-audit, and a container image scan on a
# schedule (not just on push, so drift in newly-disclosed CVEs against
# unchanged code gets caught too) and opens an issue on new findings rather
# than failing silently into a log nobody reads.
#
# The Rule also requires an annual third-party penetration test -- that is
# process/procurement work (hiring a firm, scoping an engagement), not
# something to fake as a workflow step. See docs/RUNBOOK.md for how that's
# tracked instead.
name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 0 1 1,7 *" # Jan 1 and Jul 1 -- six-monthly
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: bandit
        id: bandit
        continue-on-error: true
        run: bandit -r . -x ./tests,./evals

      - name: pip-audit
        id: pip_audit
        continue-on-error: true
        run: pip-audit

      - name: Build image
        run: docker build -t asc-recovery:scheduled-scan .

      - name: Scan image for known vulnerabilities
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: asc-recovery:scheduled-scan
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Open an issue if anything found new findings
        if: steps.bandit.outcome == 'failure' || steps.pip_audit.outcome == 'failure' || steps.trivy.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled six-monthly vulnerability scan found findings that need triage.",
              "",
              `- bandit: ${process.env.BANDIT_OUTCOME}`,
              `- pip-audit: ${process.env.PIP_AUDIT_OUTCOME}`,
              `- trivy (container image): ${process.env.TRIVY_OUTCOME}`,
              "",
              `See the run logs for details: ${runUrl}`,
              "",
              "Per the 2026 HIPAA Security Rule, this repo also requires an " +
                "annual third-party penetration test -- a process/procurement " +
                "item tracked separately, not something this job automates. " +
                "See docs/RUNBOOK.md.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Six-monthly security scan found new findings",
              body,
              labels: ["security"],
            });

      - name: Fail the job so it shows red, not just an issue nobody notices
        if: steps.bandit.outcome == 'failure' || steps.pip_audit.outcome == 'failure' || steps.trivy.outcome == 'failure'
        run: exit 1
