[project]
name = "asc-recovery"
version = "0.1.0"
requires-python = ">=3.12"
# Everything the running application (src/main.py and everything it
# imports) actually needs at runtime -- this is what a production Docker
# image installs via `pip install .` (no extras). Split out from `dev`
# in Phase 9 specifically so the image doesn't also ship pytest/ruff/mypy;
# before that, dependencies lived entirely under `dev` because nothing
# had packaged a runnable production entrypoint yet.
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "cryptography>=42",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
# Local development and CI only -- `pip install -e ".[dev]"` installs
# these on top of the runtime dependencies above.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "openapi-spec-validator>=0.7",
    "pip-tools>=7",
    "cyclonedx-bom>=7",
    "bandit>=1.9",
    "pip-audit>=2.10",
]
# F-18 (docs/audit/REGISTER.md): only scripts/ingestion/poll_remittances.py
# needs these -- deliberately not in the base `dependencies` list, so the
# main API image (and everything else that imports `ingestion.sources`)
# never carries a hard dependency on either SDK. `pip install -e ".[poller]"`
# before running that script.
poller = [
    "paramiko>=3.4",
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true
files = ["src", "tests"]

# F-18 (docs/audit/REGISTER.md): scripts/ingestion/poll_remittances.py
# imports these lazily, and they're deliberately not a dev dependency
# (pyproject.toml's [poller] extra, installed only where that one script
# actually runs) -- ignore_missing_imports here, not a stub package,
# since installing paramiko/boto3 (or their stubs) into the main dev
# environment for one optional script's sake would defeat the point of
# keeping them optional in the first place.
[[tool.mypy.overrides]]
module = ["paramiko", "boto3"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["evals/golden/cases.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires calling Depends()/Header()/
# Query() etc. as argument defaults -- that's the mechanism, not a mutable-
# default bug B008 is meant to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "api.auth.require_permission",
]

[tool.coverage.run]
branch = true
source = ["src/domain"]

[tool.coverage.report]
show_missing = true
